[project]
name = "lomi-market-api"
version = "1.0.0"
description = "Lomi Market grocery delivery API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.38,<0.39",
  "sqlalchemy>=2.0.45,<2.1",
  "alembic>=1.17,<1.18",
  "pydantic-settings>=2.12,<3",
  "psycopg[binary]>=3.3,<4",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.3,<0.4",
  "python-multipart>=0.0.20,<0.1",
  "Pillow>=12.1,<13",
  "email-validator>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "E501"]
