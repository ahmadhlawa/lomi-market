limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /health { proxy_pass http://backend:8000/health; }
    location /ready { proxy_pass http://backend:8000/ready; }
    location /uploads/ { alias /var/www/uploads/; try_files $uri =404; expires 7d; add_header Cache-Control "public, immutable"; }
    location / { proxy_pass http://admin:80; proxy_set_header Host $host; }
}
