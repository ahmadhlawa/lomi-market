name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e '.[dev]'
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing
        working-directory: backend
      - run: LOMI_DATABASE_URL=sqlite:///./migration-ci.db alembic upgrade head
        working-directory: backend

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
        working-directory: admin
      - run: npm test
        working-directory: admin
      - run: npm run typecheck
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npm audit --audit-level=high
        working-directory: admin

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform web --output-dir dist/mobile-web
